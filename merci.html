<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Merci — Message bien reçu | Sud Web Project</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <meta name="theme-color" content="#080C14" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080C14;
            color: #CBD5E1;
            font-family: 'DM Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 900;
            color: #fff;
            margin-bottom: 1rem;
            letter-spacing: -.02em;
        }

        h1 em {
            color: #60A5FA;
            font-style: italic;
        }

        p {
            color: #94A3B8;
            font-size: 1rem;
            line-height: 1.75;
            max-width: 480px;
            margin-bottom: 2.5rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: .9rem;
            padding: .85rem 2rem;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, .4);
            transition: transform .2s, box-shadow .2s;
        }

        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, .5);
        }

        .site-logo {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            text-decoration: none;
            color: #fff;
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        .site-logo em {
            color: #60A5FA;
            font-style: normal;
        }

        .delay-note {
            display: block;
            margin-top: 1.25rem;
            font-size: .8rem;
            color: #64748B;
        }
    </style>
</head>

<body>
    <a href="/" class="site-logo" aria-label="Sud Web Project">
        <svg viewBox="0 0 50 50" width="36" height="36" aria-hidden="true">
            <polygon points="25,2.5 45,13.75 45,36.25 25,47.5 5,36.25 5,13.75" fill="url(#g)" stroke="#3B82F6"
                stroke-width="1.5" />
            <defs>
                <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#3B82F6" />
                    <stop offset="100%" style="stop-color:#1D4ED8" />
                </linearGradient>
            </defs>
            <text x="25" y="31" text-anchor="middle" fill="white" font-size="14" font-family="monospace"
                font-weight="bold">&lt;/&gt;</text>
        </svg>
        <span>Sud<em>Web</em> Project</span>
    </a>
    <div class="icon">✅</div>
    <h1>Message <em>bien reçu.</em></h1>
    <p>Merci pour votre demande. Je reviens vers vous sous 24h avec une réponse personnalisée.</p>
    <a href="/">← Retour à l'accueil</a>
    <span class="delay-note">📅 Réponse garantie sous 24h</span>
</body>

</html>
