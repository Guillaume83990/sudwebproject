<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page introuvable — 404 | Sud Web Project</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <meta name="theme-color" content="#080C14" />
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080C14;
            color: #CBD5E1;
            font-family: 'DM Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .code {
            font-family: monospace;
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 900;
            color: rgba(59, 130, 246, .15);
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -.05em;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 900;
            color: #fff;
            margin-bottom: 1rem;
        }

        h1 em {
            color: #60A5FA;
            font-style: italic;
        }

        p {
            color: #94A3B8;
            font-size: .95rem;
            line-height: 1.75;
            max-width: 420px;
            margin-bottom: 2.5rem;
        }

        .btns {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: .9rem;
            padding: .85rem 2rem;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, .4);
            transition: transform .2s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
        }

        .btn-ghost {
            display: inline-flex;
            align-items: center;
            color: #60A5FA;
            text-decoration: none;
            font-size: .9rem;
            font-weight: 600;
            padding: .85rem 2rem;
            border: 1px solid rgba(96, 165, 250, .25);
            border-radius: 50px;
            transition: all .2s;
        }

        .btn-ghost:hover {
            border-color: rgba(96, 165, 250, .5);
            background: rgba(59, 130, 246, .08);
        }

        @media (max-width: 480px) {
            .btns {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="code">404</div>
    <h1>Page <em>introuvable.</em></h1>
    <p>Cette page n'existe pas ou a été déplacée. Revenez à l'accueil ou contactez-moi si vous pensez qu'il s'agit d'une
        erreur.</p>
    <div class="btns">
        <a href="/" class="btn-primary">← Retour à l'accueil</a>
        <a href="/#contact" class="btn-ghost">Me contacter</a>
    </div>
</body>

</html>
